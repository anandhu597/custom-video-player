<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom-video-player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="dropZone">
      <span id="dropZoneText">Drag video here</span>
    </div>
    <div id="playerContainer">
      <video id="videoPlayer" width="600" preload="auto"></video>

      <div id="controlsBar">
        <button id="playPauseBtn">▶</button>
        <!-- Progress Container holding the preview and range input -->
        <div id="progressContainer">
          <div id="hoverPreview" class="hidden">00:00</div>
          <input type="range" id="progressBar" value="0" min="0" max="100" />
        </div>
        <span id="timeDisplay">00:00/00:00</span>
        <button id="muteBtn">🔊</button>
        <input
          type="range"
          id="volumeSlider"
          min="0"
          max="1"
          step="0.1"
          value="1"
        />
        <button id="fullscreenBtn">⛶</button>
      </div>
    </div>
    <input type="file" accept="video/*" name="" id="fileInput" />
    <script src="script.js"></script>
  </body>
</html>
